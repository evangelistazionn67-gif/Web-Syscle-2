<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syscle - Storefront</title><link rel="stylesheet" href="../Styles/global.css"><link rel="stylesheet" href="../Styles/homepage_styles.css"><link rel="stylesheet" href="../Styles/shop_additions.css">
</head>
<body>
  <header class="top-nav">
    <div class="logo-area"><h2>Web-Syscle</h2><p>Shop &amp; Customize</p></div>
    <div class="search-container">
      <input type="text" id="main-search-input" class="search-bar" placeholder="Search categories or parts...">
      <img src="../Icons_and_Buttons/icon_clear.jpg" alt="Clear" id="clear-search" class="search-action-icon">
      <img src="../Icons_and_Buttons/icon_search.jpg" alt="Search" id="execute-search" class="search-action-icon">
    </div>
    <div class="nav-actions"><a href="cart.html"><img src="../Icons_and_Buttons/Icon_Cart.jpg" alt="Cart" class="nav-icon cart-icon"></a><a href="account.html"><img src="../Icons_and_Buttons/Icon_Account.jpg" alt="Account" class="nav-icon profile-icon"></a></div>
  </header>
<main class="customer-dashboard"><div class="category-grid"><!-- categories load from SQL Server --></div></main>
  <section class="sy-shelf"><h2>All parts <span id="shelf-count"></span></h2><div class="sy-fbar" id="shelf-chips"></div><div class="sy-products" id="shelf-products"></div></section>
  <div class="support-btn"><img src="../Icons_and_Buttons/icon_support.jpg" alt="Support" class="support-icon"></div>
  <script src="../JavaScripts/api.js"></script><script src="../JavaScripts/customer.js"></script>
</body>
</html>
